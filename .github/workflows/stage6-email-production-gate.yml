name: Stage 6 Email Production Gate

on:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shippingapp-stage6-email-production
  cancel-in-progress: true

jobs:
  email-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://shippingapp.marciofabrizio.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      D1_DATABASE_NAME: shippingapp-db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Stage 6 gate credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ "${#INTERNAL_API_TOKEN}" -ge 32 ] || { echo "::error::INTERNAL_API_TOKEN must be at least 32 characters"; exit 1; }

      - name: Resolve production D1 binding
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 info "$D1_DATABASE_NAME" --json > /tmp/d1-info.json
          node scripts/resolve-production-d1-config.mjs /tmp/d1-info.json wrangler.jsonc .wrangler.production.json "$D1_DATABASE_NAME"
          echo "WRANGLER_PRODUCTION_CONFIG=.wrangler.production.json" >> "$GITHUB_ENV"

      - name: Verify production email ownership schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute DB --remote --config "$WRANGLER_PRODUCTION_CONFIG" --json --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('email_preferences') WHERE name='user_id' AND pk=1) AS pref_owner_pk, (SELECT COUNT(*) FROM pragma_foreign_key_list('email_preferences') WHERE \"table\"='users' AND \"from\"='user_id' AND \"to\"='id' AND on_delete='CASCADE') AS pref_user_fk, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_email_events_user_created') AS event_user_index, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_email_events_provider_message' AND sql LIKE '%UNIQUE INDEX%') AS provider_message_unique, (SELECT COUNT(*) FROM pragma_foreign_key_list('email_events') WHERE \"table\"='users' AND \"from\"='user_id' AND \"to\"='id' AND on_delete='SET NULL') AS event_user_fk, (SELECT COUNT(*) FROM pragma_index_list('email_events') WHERE \"unique\"=1) AS event_unique_indexes" > /tmp/d1-email-schema.json
          node - <<'NODE'
          const fs = require('node:fs')
          const parsed = JSON.parse(fs.readFileSync('/tmp/d1-email-schema.json', 'utf8'))
          const rows = Array.isArray(parsed) ? parsed.flatMap((part) => part.results || []) : (parsed.results || [])
          const row = rows[0]
          if (!row
            || Number(row.pref_owner_pk) !== 1
            || Number(row.pref_user_fk) !== 1
            || Number(row.event_user_index) !== 1
            || Number(row.provider_message_unique) !== 1
            || Number(row.event_user_fk) !== 1
            || Number(row.event_unique_indexes) < 2) {
            throw new Error(`Stage 6 production D1 email schema mismatch: ${JSON.stringify(row)}`)
          }
          console.log('Stage 6 production D1 email ownership schema: PASS')
          NODE

      - name: Production email boundary adversarial smoke test
        run: node scripts/smoke-production-email-boundary.mjs
