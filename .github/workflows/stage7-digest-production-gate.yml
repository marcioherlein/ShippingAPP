name: Stage 7 Digest Production Gate

on:
  workflow_run:
    workflows: ["Deploy Production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shippingapp-stage7-digest-production
  cancel-in-progress: true

jobs:
  digest-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://shippingapp.marciofabrizio.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      D1_DATABASE_NAME: shippingapp-db
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Stage 7 gate credentials
        shell: bash
        run: |
          set -euo pipefail
          [ -n "${CLOUDFLARE_API_TOKEN:-}" ] || { echo "::error::Missing CLOUDFLARE_API_TOKEN"; exit 1; }
          [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ] || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          [ "${#INTERNAL_API_TOKEN}" -ge 32 ] || { echo "::error::INTERNAL_API_TOKEN must be at least 32 characters"; exit 1; }

      - name: Verify hourly reconciler configuration
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const fs = require('node:fs')
          const config = JSON.parse(fs.readFileSync('wrangler.jsonc', 'utf8'))
          const crons = config?.triggers?.crons || []
          if (!Array.isArray(crons) || !crons.includes('0 * * * *')) {
            throw new Error(`Stage 7 hourly reconciler cron missing: ${JSON.stringify(crons)}`)
          }
          if (config?.vars?.EMAIL_SENDING_ENABLED !== 'false' && !process.env.ALLOW_STAGE8_EMAIL_ENABLEMENT) {
            console.log(`Stage 7 gate: email sending is ${config?.vars?.EMAIL_SENDING_ENABLED}; Stage 8 may deliberately enable it later.`)
          }
          console.log('Stage 7 hourly reconciler configuration: PASS')
          NODE

      - name: Resolve production D1 binding
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 info "$D1_DATABASE_NAME" --json > /tmp/d1-info.json
          node scripts/resolve-production-d1-config.mjs /tmp/d1-info.json wrangler.jsonc .wrangler.production.json "$D1_DATABASE_NAME"
          echo "WRANGLER_PRODUCTION_CONFIG=.wrangler.production.json" >> "$GITHUB_ENV"

      - name: Verify production digest scheduler schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute DB --remote --config "$WRANGLER_PRODUCTION_CONFIG" --json --command "SELECT (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='digest_runs') AS run_table, (SELECT COUNT(*) FROM sqlite_master WHERE type='table' AND name='digest_run_recipients') AS recipient_table, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_digest_runs_status_updated') AS run_index, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_digest_recipients_run_status') AS recipient_status_index, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_digest_recipients_user_created') AS recipient_user_index, (SELECT COUNT(*) FROM pragma_table_info('digest_runs') WHERE name='lease_owner') AS lease_owner_column, (SELECT COUNT(*) FROM pragma_table_info('digest_runs') WHERE name='lease_expires_at') AS lease_expiry_column, (SELECT COUNT(*) FROM pragma_foreign_key_list('digest_run_recipients') WHERE \"table\"='digest_runs' AND \"from\"='run_id' AND \"to\"='id') AS run_fk, (SELECT COUNT(*) FROM pragma_foreign_key_list('digest_run_recipients') WHERE \"table\"='users' AND \"from\"='user_id' AND \"to\"='id') AS user_fk, (SELECT COUNT(*) FROM pragma_foreign_key_list('digest_run_recipients') WHERE \"table\"='email_events' AND \"from\"='email_event_id' AND \"to\"='id') AS event_fk, (SELECT COUNT(*) FROM pragma_table_info('digest_run_recipients') WHERE lower(name) LIKE '%email%' OR lower(name) LIKE '%recipient%' OR lower(name) LIKE '%subject%' OR lower(name) LIKE '%html%' OR lower(name) LIKE '%product%') AS forbidden_columns" > /tmp/d1-digest-schema.json
          node - <<'NODE'
          const fs = require('node:fs')
          const parsed = JSON.parse(fs.readFileSync('/tmp/d1-digest-schema.json', 'utf8'))
          const rows = Array.isArray(parsed) ? parsed.flatMap((part) => part.results || []) : (parsed.results || [])
          const row = rows[0]
          if (!row
            || Number(row.run_table) !== 1
            || Number(row.recipient_table) !== 1
            || Number(row.run_index) !== 1
            || Number(row.recipient_status_index) !== 1
            || Number(row.recipient_user_index) !== 1
            || Number(row.lease_owner_column) !== 1
            || Number(row.lease_expiry_column) !== 1
            || Number(row.run_fk) !== 1
            || Number(row.user_fk) !== 1
            || Number(row.event_fk) !== 1
            || Number(row.forbidden_columns) !== 1) {
            // `email_event_id` is the one intentionally allowed email-named column.
            throw new Error(`Stage 7 production D1 digest schema mismatch: ${JSON.stringify(row)}`)
          }
          console.log('Stage 7 production D1 digest scheduler schema + run lease: PASS')
          NODE

      - name: Production digest boundary adversarial smoke test
        run: node scripts/smoke-production-digest-boundary.mjs
