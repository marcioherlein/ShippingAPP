name: CI

on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx --yes vitest@3.2.4 run
      - run: npm run build
      - run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run
