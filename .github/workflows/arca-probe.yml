name: ARCA Tariff Probe

on:
  push:
    branches: [feature/ncm-intelligence]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download official ARCA archive
        run: |
          set -euxo pipefail
          curl -fL --retry 3 --retry-delay 2 'https://serviciosweb.afip.gob.ar/aduana/arancelintegrado/archivos/arancel.zip' -o /tmp/arancel.zip
          rm -rf /tmp/arancel && mkdir -p /tmp/arancel
          unzip -q /tmp/arancel.zip -d /tmp/arancel
      - name: Inspect NCM 95.06 records
        run: |
          set -euxo pipefail
          NOM=$(find /tmp/arancel -type f -name 'nomenclador_*.txt' | head -1)
          echo "NOMENCLADOR=$NOM"
          grep '^2@9506' "$NOM" | head -n 80 || true
          python - <<'PY'
          from pathlib import Path
          p=next(Path('/tmp/arancel').glob('nomenclador_*.txt'))
          lines=p.read_text(encoding='latin-1').splitlines()
          rows=[x for x in lines if x.startswith('2@9506')]
          print('COUNT_9506', len(rows))
          for line in rows[:20]:
              parts=line.split('@')
              print('FIELDS', len(parts), parts)
          PY
