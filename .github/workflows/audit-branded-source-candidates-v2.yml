name: Argentina Branded Source Candidates V2

on:
  push:
    branches:
      - audit/branded-source-candidates-v2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe structured branded source candidates
        run: node scripts/audit-branded-source-candidates-v2.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run same-time branded source-set A-B benchmark
        run: npx tsx scripts/audit-branded-source-ab.ts
