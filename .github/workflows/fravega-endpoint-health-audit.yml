name: Fravega Endpoint Health Audit

on:
  push:
    branches:
      - audit/fravega-endpoint-health-20260902
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe Fravega and control VTEX endpoints
        run: node scripts/audit-fravega-endpoint-health.mjs
      - name: Inspect Fravega category HTML / Next data
        run: node scripts/audit-fravega-category-pages.mjs
