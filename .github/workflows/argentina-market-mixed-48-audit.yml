name: Argentina Market Mixed 48 Audit

on:
  push:
    branches:
      - audit/argentina-market-mixed-48
      - audit/mixed48-semantics-v2

# Evidence-aware audit semantics v2. The production corpus and request parameters remain unchanged.
# Rerun marker: 2026-09-02 deeper relaxed pool production experiment.
permissions:
  contents: read

jobs:
  mixed-market:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_URL: https://shippingapp.marciofabrizio.workers.dev
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      MIXED_AUDIT_CONCURRENCY: '2'
      MIXED_AUDIT_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test mixed-48 audit semantics
        run: node scripts/mixed48-audit-semantics.test.mjs
      - name: Run 48-product evidence-aware production audit
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/audit-production-argentina-market-mixed-48-v2.mjs
