name: NCM Hierarchy Probe
on:
  push:
    branches: [feature/full-ncm-retrieval]
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: curl -fL 'https://serviciosweb.afip.gob.ar/aduana/arancelintegrado/archivos/arancel.zip' -o /tmp/a.zip
      - run: mkdir /tmp/a && unzip -q /tmp/a.zip -d /tmp/a
      - name: Show hierarchy before known SIM opening
        run: |
          NOM=$(find /tmp/a -name 'nomenclador_*.txt' | head -1)
          python - "$NOM" <<'PY'
          from pathlib import Path
          import sys
          p=Path(sys.argv[1])
          lines=p.read_text(encoding='latin-1').splitlines()
          for i,line in enumerate(lines):
              if '9506.59.00.900Z' in line:
                  print('FOUND_AT', i)
                  for j,x in enumerate(lines[max(0,i-30):i+8], start=max(0,i-30)):
                      print(j, x)
                  break
          else:
              raise SystemExit('SIM anchor not found')
          PY
