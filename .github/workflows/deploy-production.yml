name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shippingapp-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      PRODUCTION_URL: https://shippingapp.marciofabrizio.workers.dev
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      D1_DATABASE_NAME: shippingapp-db
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      CLERK_JWT_KEY: ${{ secrets.CLERK_JWT_KEY }}
      CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Cloudflare deployment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_API_TOKEN. Add a Cloudflare API token with Workers Scripts edit/deploy and D1 write permissions."
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::Missing GitHub secret CLOUDFLARE_ACCOUNT_ID. Add your Cloudflare account id."
            exit 1
          fi

      - name: Validate optional auth deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          configured=0
          [ -n "${CLERK_SECRET_KEY:-}" ] && configured=$((configured + 1))
          [ -n "${CLERK_JWT_KEY:-}" ] && configured=$((configured + 1))
          [ -n "${CLERK_PUBLISHABLE_KEY:-}" ] && configured=$((configured + 1))
          if [ "$configured" -ne 0 ] && [ "$configured" -ne 3 ]; then
            echo "::error::Clerk deployment configuration is partial. Configure CLERK_SECRET_KEY, CLERK_JWT_KEY and repository variable VITE_CLERK_PUBLISHABLE_KEY together."
            exit 1
          fi
          if [ -n "${INTERNAL_API_TOKEN:-}" ] && [ "${#INTERNAL_API_TOKEN}" -lt 32 ]; then
            echo "::error::INTERNAL_API_TOKEN must be at least 32 characters."
            exit 1
          fi

      - run: npm install --no-audit --no-fund

      - name: Unit and integration tests
        run: npx --yes vitest@3.2.4 run

      - name: Validate D1 migrations and schema locally
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .d1-ci
          npx --yes wrangler@latest d1 migrations apply DB --local --persist-to .d1-ci
          npx --yes wrangler@latest d1 migrations apply DB --local --persist-to .d1-ci
          node scripts/validate-d1-schema.mjs

      - name: Validate NCM and SIM assets
        run: node scripts/validate-nomenclador-assets.mjs

      - name: Production build
        run: npm run build

      - name: Validate Cloudflare configuration
        run: npx --yes wrangler@latest check

      - name: Resolve existing production D1 binding
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 info "$D1_DATABASE_NAME" --json > /tmp/d1-info.json
          node scripts/resolve-production-d1-config.mjs /tmp/d1-info.json wrangler.jsonc .wrangler.production.json "$D1_DATABASE_NAME"
          echo "WRANGLER_PRODUCTION_CONFIG=.wrangler.production.json" >> "$GITHUB_ENV"

      - name: Sync optional auth secrets to Cloudflare
        shell: bash
        run: |
          set -euo pipefail
          put_secret() {
            local name="$1"
            local value="$2"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx --yes wrangler@latest versions secret put "$name" --config "$WRANGLER_PRODUCTION_CONFIG" >/dev/null
            fi
          }
          put_secret INTERNAL_API_TOKEN "${INTERNAL_API_TOKEN:-}"
          put_secret CLERK_SECRET_KEY "${CLERK_SECRET_KEY:-}"
          put_secret CLERK_JWT_KEY "${CLERK_JWT_KEY:-}"
          put_secret CLERK_PUBLISHABLE_KEY "${CLERK_PUBLISHABLE_KEY:-}"

      - name: Deploy to Cloudflare Workers
        run: npx --yes wrangler@latest deploy --config "$WRANGLER_PRODUCTION_CONFIG"

      - name: Apply production D1 migrations
        run: npx --yes wrangler@latest d1 migrations apply DB --remote --config "$WRANGLER_PRODUCTION_CONFIG"

      - name: Verify production D1 schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute DB --remote --config "$WRANGLER_PRODUCTION_CONFIG" --json --command "SELECT name FROM sqlite_master WHERE type='table' AND name IN ('users','plans','subscriptions','usage_periods','credit_ledger','analyses','watchlist_items','watchlist_snapshots','email_preferences','email_events','billing_events') ORDER BY name" > /tmp/d1-schema.json
          node - <<'NODE'
          const fs = require('node:fs')
          const parsed = JSON.parse(fs.readFileSync('/tmp/d1-schema.json', 'utf8'))
          const rows = Array.isArray(parsed) ? parsed.flatMap((part) => part.results || []) : (parsed.results || [])
          const names = rows.map((row) => row.name).sort()
          const expected = ['analyses','billing_events','credit_ledger','email_events','email_preferences','plans','subscriptions','usage_periods','users','watchlist_items','watchlist_snapshots'].sort()
          if (JSON.stringify(names) !== JSON.stringify(expected)) throw new Error(`Production D1 schema mismatch: ${JSON.stringify(names)}`)
          NODE

      - name: Verify production analysis history schema
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest d1 execute DB --remote --config "$WRANGLER_PRODUCTION_CONFIG" --json --command "SELECT (SELECT COUNT(*) FROM pragma_table_info('analyses') WHERE name='deleted_at') AS deleted_at_column, (SELECT COUNT(*) FROM sqlite_master WHERE type='index' AND name='idx_analyses_user_visible_created') AS visible_index" > /tmp/d1-history-schema.json
          node - <<'NODE'
          const fs = require('node:fs')
          const parsed = JSON.parse(fs.readFileSync('/tmp/d1-history-schema.json', 'utf8'))
          const rows = Array.isArray(parsed) ? parsed.flatMap((part) => part.results || []) : (parsed.results || [])
          const row = rows[0]
          if (!row || Number(row.deleted_at_column) !== 1 || Number(row.visible_index) !== 1) {
            throw new Error(`Stage 3 production D1 history schema mismatch: ${JSON.stringify(row)}`)
          }
          NODE

      - name: Production auth boundary adversarial smoke test
        run: node scripts/smoke-production-auth-boundary.mjs

      - name: Production private-history boundary adversarial smoke test
        run: node scripts/smoke-production-history-boundary.mjs

      - name: Production privileged runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          args=(-fsS)
          if [ -n "${INTERNAL_API_TOKEN:-}" ]; then
            args+=(-H "x-shippingapp-internal-token: $INTERNAL_API_TOKEN")
          fi
          curl "${args[@]}" "$PRODUCTION_URL/api/runtime-smoke" > /tmp/production-smoke.json
          node - <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync('/tmp/production-smoke.json', 'utf8'))
          function assertNcmAsset(ncm, label) {
            const legacy = ncm?.sourceDate === '2026-08-14' && ncm?.tariffDataIncluded === false
            const ncmApp = ncm?.source === 'NCM_APP.xlsx' && ncm?.sourceDate === '2026-08-27' && ncm?.tariffDataIncluded === true
            if (!legacy && !ncmApp) throw new Error(`${label} NCM asset metadata mismatch: ${JSON.stringify(ncm)}`)
            if ((ncm?.records ?? 0) < 10000) throw new Error(`${label} NCM asset unexpectedly small`)
          }
          if (body.status !== 'ok') throw new Error(`production smoke failed: ${JSON.stringify(body)}`)
          if (!body.checks?.workerResponded) throw new Error('Production Worker did not confirm response')
          if (!body.checks?.assetsBinding) throw new Error('Production ASSETS binding missing')
          assertNcmAsset(body.checks?.ncmIndex, 'Production')
          if (body.checks?.simChapter95?.sourceDate !== '2026-08-14') throw new Error('Production SIM asset date mismatch')
          NODE

      - name: Production Alibaba self-scrape smoke test (no Parse.bot)
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/smoke-production-alibaba-self.mjs

      # Product-level gate: the free direct-retailer tier must prove at least one
      # real live benchmark with >=5 traceable comparables. Mercado Libre can be
      # independently degraded without blocking the whole Argentina capability.
      - name: Production free Argentina market benchmark gate
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/smoke-production-argentina-market.mjs

      # User-path gate: prove the actual intake/economics response promotes the
      # same direct-retailer benchmark and cannot retain stale ML-only evidence.
      # This runs before the independent Alibaba opportunity-search provider so
      # its billing/availability incident cannot hide Argentina economics health.
      - name: Production hybrid economics user-path gate
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/smoke-production-hybrid-economics.mjs

      - name: Production MercadoLibre provider diagnostic
        continue-on-error: true
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/smoke-production-mercadolibre.mjs

      - name: Production opportunity search smoke test
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/smoke-production-opportunity.mjs

      - name: Production intake smoke test
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/smoke-production-intake.mjs
