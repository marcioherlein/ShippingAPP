name: Sports Public Catalog Platform Audit

on:
  push:
    branches:
      - audit/sports-source-platforms

permissions:
  contents: read

jobs:
  platforms:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe stable public catalog APIs
        run: node scripts/audit-sports-public-catalog-platforms.mjs
