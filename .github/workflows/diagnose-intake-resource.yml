name: Diagnose Intake Resource Limit
on:
  push:
    branches: [diagnose/intake-resource]
    paths: [.github/workflows/diagnose-intake-resource.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Read effective Workers limits
        run: |
          node --input-type=module <<'NODE'
          const root = 'https://api.cloudflare.com/client/v4/accounts/' + process.env.CLOUDFLARE_ACCOUNT_ID
          for (const path of ['/workers/account-settings', '/workers/scripts/shippingapp/settings', '/subscriptions']) {
            const response = await fetch(root + path, { headers: { authorization: 'Bearer ' + process.env.CLOUDFLARE_API_TOKEN }, signal: AbortSignal.timeout(20000) })
            const body = await response.json()
            const r = body.result
            console.log(JSON.stringify({ path, httpStatus: response.status, success: body.success,
              defaultUsageModel: r?.default_usage_model, usageModel: r?.usage_model, limits: r?.limits,
              workersPlans: Array.isArray(r) ? r.filter(s => /workers/i.test(JSON.stringify(s.rate_plan || {}))).map(s => ({ name: s.rate_plan?.public_name, id: s.rate_plan?.id })) : undefined,
              errorCodes: body.errors?.map(e => e.code)
            }))
          }
          NODE
