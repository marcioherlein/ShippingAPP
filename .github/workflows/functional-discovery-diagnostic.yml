name: Functional Retailer Discovery Diagnostic

on:
  push:
    branches:
      - audit/functional-discovery-diagnostic

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Probe strict vs category-only retailer discovery
        run: npx --yes tsx scripts/diagnose-functional-retailers.ts
