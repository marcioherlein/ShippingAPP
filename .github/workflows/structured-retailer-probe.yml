name: Structured Retailer Probe

on:
  push:
    branches:
      - audit/structured-retailer-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe public structured retailer endpoints
        run: node scripts/probe-structured-retailers.mjs
