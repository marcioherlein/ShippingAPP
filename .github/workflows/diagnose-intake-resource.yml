name: Diagnose Intake Resource Limit
on:
  push:
    branches: [diagnose/intake-resource]
    paths: [.github/workflows/diagnose-intake-resource.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --no-audit --no-fund wrangler@4
      - name: Capture only probe outcome and resource metrics
        shell: bash
        run: |
          set -euo pipefail
          # Strip requests, headers, console messages and exception text before output.
          timeout 130s node_modules/.bin/wrangler tail shippingapp --format json --header 'x-shippingapp-diagnostic: resource-probe' |
            jq --unbuffered -c '{outcome, cpuTime, wallTime, exceptions: [.exceptions[]? | {name}], status: .event.response.status}' > /tmp/resource-summary.jsonl &
          trace_pid=$!
          trap 'kill "$trace_pid" 2>/dev/null || true' EXIT
          sleep 12
          node --input-type=module <<'NODE'
          const origin = 'https://shippingapp.marciofabrizio.workers.dev'
          const headers = {
            'content-type': 'application/json',
            'x-shippingapp-diagnostic': 'resource-probe',
            'x-shippingapp-internal-token': process.env.INTERNAL_API_TOKEN,
          }
          if (!process.env.INTERNAL_API_TOKEN) throw new Error('Missing service authentication')
          const probes = [
            ['/api/intake', { message: 'Mouse inalámbrico óptico para computadora, origen China, precio proveedor USD 2.70, MOQ 400 unidades, peso embalado 0.12 kg por unidad, volumen 0.002 m3 por unidad.' }],
            ['/api/argentina-market/benchmark', { productName: 'Mouse inalámbrico óptico para computadora', category: 'Computer mouse' }],
          ]
          for (const [path, payload] of probes) {
            const start = Date.now()
            try {
              const response = await fetch(origin + path, { method: 'POST', headers, body: JSON.stringify(payload), signal: AbortSignal.timeout(45000) })
              const raw = await response.text()
              let body
              try { body = JSON.parse(raw) } catch {}
              console.log(JSON.stringify({ path, httpStatus: response.status, elapsedMs: Date.now()-start,
                status: body?.status, resourceLimit: raw.includes('Worker exceeded resource limits') }))
            } catch { console.log(JSON.stringify({ path, requestFailed: true, elapsedMs: Date.now()-start })) }
          }
          NODE
          sleep 8
          cat /tmp/resource-summary.jsonl
          test -s /tmp/resource-summary.jsonl
