name: CI

on:
  push:
    branches: [main, 'feature/**', 'audit/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Unit and integration tests
        run: npx --yes vitest@3.2.4 run
      - name: Validate NCM and SIM assets
        run: node scripts/validate-nomenclador-assets.mjs
      - name: Production build
        run: npm run build
      - name: Validate Cloudflare configuration
        run: npx --yes wrangler@latest check
      - name: Validate Cloudflare deployment bundle
        run: npx --yes wrangler@latest deploy --dry-run --outdir .wrangler-dry-run
      - name: Runtime smoke test via Wrangler
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@latest dev --local --ip 127.0.0.1 --port 8787 > /tmp/wrangler-smoke.log 2>&1 &
          WRANGLER_PID=$!
          trap 'kill $WRANGLER_PID >/dev/null 2>&1 || true; cat /tmp/wrangler-smoke.log' EXIT

          for i in {1..40}; do
            if curl -fsS http://127.0.0.1:8787/api/runtime-smoke > /tmp/runtime-smoke.json; then
              node - <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync('/tmp/runtime-smoke.json', 'utf8'))
          function assertNcmAsset(ncm, label) {
            const legacy = ncm?.sourceDate === '2026-08-14' && ncm?.tariffDataIncluded === false
            const ncmApp = ncm?.source === 'NCM_APP.xlsx' && ncm?.sourceDate === '2026-08-27' && ncm?.tariffDataIncluded === true
            if (!legacy && !ncmApp) throw new Error(`${label} NCM asset metadata mismatch: ${JSON.stringify(ncm)}`)
            if ((ncm?.records ?? 0) < 10000) throw new Error(`${label} NCM asset unexpectedly small`)
          }
          if (body.status !== 'ok') throw new Error(`runtime smoke failed: ${JSON.stringify(body)}`)
          if (!body.checks?.workerResponded) throw new Error('Worker did not confirm response')
          if (!body.checks?.assetsBinding) throw new Error('ASSETS binding missing')
          assertNcmAsset(body.checks?.ncmIndex, 'Runtime')
          if (body.checks?.simChapter95?.sourceDate !== '2026-08-14') throw new Error('SIM asset date mismatch')
          NODE
              exit 0
            fi
            sleep 1
          done

          echo 'Runtime smoke endpoint did not become ready'
          exit 1
      - name: Production Cloudflare smoke test
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS https://shippingapp.marciofabrizio.workers.dev/api/runtime-smoke > /tmp/production-smoke.json
          node - <<'NODE'
          const fs = require('node:fs')
          const body = JSON.parse(fs.readFileSync('/tmp/production-smoke.json', 'utf8'))
          function assertNcmAsset(ncm, label) {
            const legacy = ncm?.sourceDate === '2026-08-14' && ncm?.tariffDataIncluded === false
            const ncmApp = ncm?.source === 'NCM_APP.xlsx' && ncm?.sourceDate === '2026-08-27' && ncm?.tariffDataIncluded === true
            if (!legacy && !ncmApp) throw new Error(`${label} NCM asset metadata mismatch: ${JSON.stringify(ncm)}`)
            if ((ncm?.records ?? 0) < 10000) throw new Error(`${label} NCM asset unexpectedly small`)
          }
          if (body.status !== 'ok') throw new Error(`production smoke failed: ${JSON.stringify(body)}`)
          if (!body.checks?.workerResponded) throw new Error('Production Worker did not confirm response')
          if (!body.checks?.assetsBinding) throw new Error('Production ASSETS binding missing')
          assertNcmAsset(body.checks?.ncmIndex, 'Production')
          if (body.checks?.simChapter95?.sourceDate !== '2026-08-14') throw new Error('Production SIM asset date mismatch')
          NODE
      - name: Mercado Libre Top 50 NCM production audit
        run: node scripts/audit-meli-top50-ncm-production.mjs
