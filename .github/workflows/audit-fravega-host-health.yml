name: Fravega Host Health Audit

on:
  push:
    branches:
      - audit/fravega-host-health
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe Fravega public storefront hosts
        run: node scripts/audit-fravega-host-health.mjs
