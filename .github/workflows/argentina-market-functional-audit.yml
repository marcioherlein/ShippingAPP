name: Argentina Market Functional Audit

on:
  push:
    branches:
      - audit/argentina-market-functional-smoke

permissions:
  contents: read

jobs:
  functional-market:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRODUCTION_URL: https://shippingapp.marciofabrizio.workers.dev
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      FUNCTIONAL_SMOKE_TIMEOUT_MS: '30000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run production exact-vs-functional market audit
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/audit-production-functional-market.mjs
