name: Probe Alibaba Link

on:
  workflow_dispatch:
    inputs:
      alibaba_url:
        description: Public Alibaba product URL to diagnose without starting a paid analysis
        type: string
        required: true
        default: https://www.alibaba.com/product-detail/Factory-Manufacture-Inner-Bladder-Basketball-Making_1601389995797.html

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PRODUCTION_URL: https://shippingapp.marciofabrizio.workers.dev
      INTERNAL_API_TOKEN: ${{ secrets.INTERNAL_API_TOKEN }}
      ALIBABA_URL: ${{ inputs.alibaba_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe customer product read and isolate direct/browser providers
        env:
          NODE_OPTIONS: --import=./scripts/smoke-auth-bootstrap.mjs
        run: node scripts/probe-alibaba-product-read.mjs
