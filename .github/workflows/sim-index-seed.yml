name: SIM Index Seed
on:
  push:
    branches: [feature/sim-hydration]
permissions:
  contents: write
jobs:
  seed:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/sim-hydration
      - name: Build official SIM snapshots
        run: |
          curl -fL --retry 3 'https://serviciosweb.afip.gob.ar/aduana/arancelintegrado/archivos/arancel.zip' -o /tmp/a.zip
          mkdir -p /tmp/a && unzip -q /tmp/a.zip -d /tmp/a
          NOM=$(find /tmp/a -name 'nomenclador_*.txt' | head -1)
          node scripts/build-sim-index.mjs "$NOM" public/data/sim
      - name: Validate SIM snapshot architecture
        run: |
          node - <<'NODE'
          const fs=require('fs'), path=require('path')
          const dir='public/data/sim'
          const manifest=JSON.parse(fs.readFileSync(path.join(dir,'manifest.json'),'utf8'))
          const assert=(ok,msg)=>{if(!ok) throw new Error(msg)}
          assert(manifest.sourceDate==='2026-08-14', `unexpected date ${manifest.sourceDate}`)
          assert(manifest.simIndexSchema===1, 'wrong SIM schema')
          assert(manifest.tariffDataIncluded===false, 'SIM assets must not contain tariff fields')
          assert(manifest.chapterCount>80, `too few chapters ${manifest.chapterCount}`)
          assert(manifest.totalBytes<15000000, `SIM assets too large ${manifest.totalBytes}`)
          let max=0, maxFile=''
          for(const file of fs.readdirSync(dir).filter(f=>/^\d{2}\.json$/.test(f))){
            const bytes=fs.statSync(path.join(dir,file)).size
            if(bytes>max){max=bytes;maxFile=file}
            assert(bytes<1500000, `${file} too large ${bytes}`)
          }
          const c95=JSON.parse(fs.readFileSync(path.join(dir,'95.json'),'utf8'))
          const r95=new Map(c95.records.map(r=>[r[0],r]))
          assert(r95.get('9506.59.00')?.[2].some(s=>s[0]==='9506.59.00.900Z'),'missing padel residual SIM')
          const c85=JSON.parse(fs.readFileSync(path.join(dir,'85.json'),'utf8'))
          assert(c85.records.some(r=>r[0]==='8504.40.90'),'missing power-converter NCM detail')
          console.log({manifest,max,maxFile})
          NODE
      - name: Commit snapshots if changed
        run: |
          git add public/data/sim
          if git diff --cached --quiet -- public/data/sim; then
            echo 'SIM indexes unchanged'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'data: seed official ARCA SIM detail indexes'
          git push origin HEAD:feature/sim-hydration
